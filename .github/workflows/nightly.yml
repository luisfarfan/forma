name: Nightly

# Fuzzing of the document loaders and the image decoder (core/fuzz): arbitrary
# bytes as a .forma file, as a .formapackage or as an image (forma-trace) must
# give an error or a valid result, never a panic, a
# hang or an out-of-memory. cargo-fuzz needs a nightly compiler; it is
# installed here only and never touches the pinned toolchain of the main CI
# (rust-toolchain.toml).
#
# macOS first (ADR 0011): the fuzzers stay on Ubuntu (they test logic that
# does not depend on the system, and libFuzzer is at home there); the mode C
# regression and the coverage gate, quality gates of the product, run on
# macOS.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [load_package, load_forma, image_decode]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked

      # The corpus the earlier nights found, so that each night goes further.
      # The seeds in core/fuzz/seeds are always added.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: core/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # 15 minutes of fuzzing. The first corpus folder receives the new finds
      # (libFuzzer needs it to exist); a single input may run 10 s at most.
      - name: Fuzz ${{ matrix.target }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=900 -timeout=10 -max_len=65536

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: core/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # A crash, timeout or out-of-memory leaves the input that caused it here.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: core/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # The mode C quality gate on the large levels of the benchmark corpus (M:
  # Inter, EB Garamond and Fraunces at three sizes; M-hand: Patrick Hand),
  # against core/crates/forma-bench/baseline.json. S, L and O run with every
  # push (ci.yml); these take minutes, so they run here.
  bench-m:
    name: mode C regression (M, M-hand)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - name: Mode C on M and M-hand
        run: cargo test -p forma-bench --release --locked --test regression -- --ignored

  # The coverage gate (80 % of the lines of each core crate,
  # scripts/coverage_gate.py). It left the per-push CI on 2026-11-03: the
  # instrumented image-to-font tests take about 36 minutes on an Apple silicon
  # laptop and outlasted 58 minutes on the runner. forma-bench is not measured
  # and its corpus runs are left out. Release build, as docs/qa/hito2-5 measured.
  coverage:
    name: coverage gate
    runs-on: macos-15
    timeout-minutes: 300
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: >-
          cargo llvm-cov --workspace --exclude forma-bench --release --locked
          --json --summary-only --output-path target/llvm-cov-summary.json
      - name: Coverage gate (80 % of lines per package)
        run: >-
          python3 -I ../scripts/coverage_gate.py target/llvm-cov-summary.json --min 80
          forma-model forma-edit forma-engine forma-store forma-trace forma-spacing
