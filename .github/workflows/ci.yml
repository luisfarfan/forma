name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      # With no arguments, rustup installs the toolchain pinned in
      # ../rust-toolchain.toml (channel 1.99.1 plus rustfmt and clippy).
      # Recent rustup releases no longer install it implicitly on first use.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test
        run: cargo test --workspace --locked

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses
        if: runner.os == 'Linux'
        run: cargo deny check licenses
