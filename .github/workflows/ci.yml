name: CI

# Milestone 1 (docs/04-roadmap.md): the whole workspace is built and tested on
# macOS, Windows and Ubuntu, and the font FORMA exports is checked by external
# oracles on all three. Ubuntu also runs the quality gates (fmt, clippy,
# licenses, coverage), the real-fsync tests, the MCP Inspector smoke run and
# fontspector; macOS also checks that the code compiles for Intel.

on:
  push:
    branches: [main, hito1]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. A push to main or
# hito1 gets a group of its own (the run id), so it is neither cancelled nor
# dropped as a "pending" run behind another one: every commit there keeps its
# own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      # With no arguments, rustup installs the toolchain pinned in
      # ../rust-toolchain.toml (channel 1.99.1 plus rustfmt and clippy).
      # Recent rustup releases no longer install it implicitly on first use.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # ---- quality gates (Ubuntu only) ----

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install cargo-deny and cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: Check licenses
        if: runner.os == 'Linux'
        run: cargo deny check licenses

      # ---- tests (all three systems) ----

      # --no-fail-fast: one failing test binary must not hide the results of
      # the others (a Windows-only failure would otherwise mask the rest).
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # Intel Macs are still a supported target: the runner is Apple silicon,
      # so this only checks that everything compiles for x86_64.
      - name: Check the Intel macOS target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --locked --target x86_64-apple-darwin

      # forma-store's own tests run with the `test-no-fsync` feature (its self
      # dev-dependency; Cargo applies a dev-dependency's features to the tests
      # and there is no flag to turn that off), so every fsync is skipped.
      # FORMA_REAL_FSYNC=1 makes that test build flush for real (see
      # core/crates/forma-store/src/atomic.rs): the durable-write path then runs
      # under test. The property tests (1 000 cases each, roadmap criterion 7)
      # take a few minutes with real flushes.
      - name: Test forma-store with real fsync
        if: runner.os == 'Linux'
        env:
          FORMA_REAL_FSYNC: "1"
        run: cargo test -p forma-store --locked

      # ---- external oracles (all three systems) ----
      # An agent builds a font over MCP stdio, then OTS, HarfBuzz, fontTools,
      # fontmake (parity) and fontspector check it: scripts/acceptance.*.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/oracle/requirements.txt

      - name: Install the Python oracles
        run: python -m pip install -r ../tools/oracle/requirements.txt

      # taiki-e/install-action has no fontspector, so it is built once with
      # cargo (version pinned, as measured in docs/qa/hito1/fontspector.md) and
      # the binary is cached. Only Ubuntu installs it, and only Ubuntu
      # requires it (FORMA_REQUIRE_FONTSPECTOR below): on macOS and Windows the
      # acceptance script prints SKIPPED for this one oracle.
      - name: Restore fontspector
        id: fontspector
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/fontspector
          key: fontspector-1.9.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install fontspector
        if: runner.os == 'Linux' && steps.fontspector.outputs.cache-hit != 'true'
        run: cargo install fontspector --version 1.9.0 --locked

      - name: Acceptance (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          FORMA_REQUIRE_FONTSPECTOR: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bash ../scripts/acceptance.sh

      - name: Acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ../scripts/acceptance.ps1

      - name: Keep the acceptance artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: out/acceptance
          if-no-files-found: ignore
          retention-days: 7

      # ---- MCP Inspector (Ubuntu only) ----
      # The official client lists the tools of the release binary and calls
      # one (`forma_capabilities`), as an external check that `forma mcp`
      # speaks MCP and executes a tool. The binary is built with `-p forma-cli`
      # alone: a `--workspace` build would unify the `test-no-fsync` feature of
      # forma-store into it.

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "24" # the Inspector needs Node >= 22.19

      - name: MCP Inspector smoke run (tools/list and tools/call)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p forma-cli --locked
          forma="$GITHUB_WORKSPACE/core/target/release/forma"
          npx -y @modelcontextprotocol/inspector@2.11.0 --cli \
            "$forma" mcp --allow-dir "$RUNNER_TEMP" --no-journal \
            --method tools/list > "$RUNNER_TEMP/tools-list.json"
          python -I -c 'import json, sys; names = [t["name"] for t in json.load(open(sys.argv[1]))["tools"]]; assert "forma_capabilities" in names, names; print(len(names), "tools listed")' "$RUNNER_TEMP/tools-list.json"
          npx -y @modelcontextprotocol/inspector@2.11.0 --cli \
            "$forma" mcp --allow-dir "$RUNNER_TEMP" --no-journal \
            --method tools/call --tool-name forma_capabilities > "$RUNNER_TEMP/tools-call.json"
          cat "$RUNNER_TEMP/tools-call.json"
          python -I -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r.get("isError") is False and "api_version" in r["structuredContent"], r; print("forma_capabilities answered, api_version", r["structuredContent"]["api_version"])' "$RUNNER_TEMP/tools-call.json"

      # ---- coverage (Ubuntu only) ----
      # Runs the whole workspace test suite instrumented, then requires 80 %
      # of the lines of each core crate to be covered. The gate is
      # scripts/coverage_gate.py, which prints one line per package.

      - name: Install llvm-tools
        if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview

      - name: Coverage
        if: runner.os == 'Linux'
        run: >-
          cargo llvm-cov --workspace --locked --json --summary-only
          --output-path target/llvm-cov-summary.json

      - name: Coverage gate (80 % of lines per package)
        if: runner.os == 'Linux'
        run: >-
          python -I ../scripts/coverage_gate.py target/llvm-cov-summary.json --min 80
          forma-model forma-edit forma-engine forma-store
