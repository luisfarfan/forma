# cargo-deny policy for the FORMA Rust workspace.
# FORMA is MIT OR Apache-2.0: GPL/LGPL (and any license not listed below)
# dependencies are rejected.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
# The allow-list is a policy, not an inventory: do not warn about allowed
# licenses that no current dependency uses.
unused-allowed-license = "allow"
