[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
fontc = "1.0.0"
rmcp = "3.5.1"
norad = "0.19.2"
kurbo = "0.13.1"
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "png", "u8_pipeline"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.2.3", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
ttf2woff2 = { version = "0.14.0", default-features = false }
woff2-patched = "0.4.0"
read-fonts = "0.43.3"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
hmac = "0.13.0"
sha2 = "0.11.1"
dunce = "1.0.5"
base64 = "0.23.1"
getrandom = "0.4.3"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
rstest = "0.27.0"
