# Fuzz targets for the FORMA document loaders (cargo-fuzz). Its own crate, outside
# the workspace (`exclude = ["fuzz"]` in ../Cargo.toml): it needs a nightly
# toolchain and libFuzzer, and must not be built by `cargo test --workspace`.
# Run it with: cargo +nightly fuzz run <target>   (from core/); see
# .github/workflows/nightly.yml and docs/adr/0004-formatos-forma-y-formapackage.md.
[package]
name = "forma-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
forma-store = { path = "../crates/forma-store" }

[[bin]]
name = "load_package"
path = "fuzz_targets/load_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_forma"
path = "fuzz_targets/load_forma.rs"
test = false
doc = false
bench = false
